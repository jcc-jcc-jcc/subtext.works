<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subtext.works</title>
    <style>
        /* Color Palette (Dark Grey/Green & Yellow) */
        :root {
            --bg-color: #181a18;       /* Dark grey-green background */
            --text-color: #ebd15b;     /* Classic yellow text */
        }

        /* 1. Registering the .woff file */
        @font-face {
            font-family: 'RadioGrotesk';
            src: url('PPRadioGrotesk-BoldItalic.woff') format('woff');
            font-weight: bold;
            font-style: italic;
            font-display: swap;
        }

        /* 2. Page Layout & Smooth Scrolling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;          /* Enables vertical scrolling */
            font-family: 'RadioGrotesk', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            position: relative;
        }

        /* 3. Section Containers */
        .first-fold,
        .second-fold {
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* 4. Centered Layout Units */
        .logo-unit,
        .projects-section {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            
            /* Fade-in Animation */
            opacity: 0;
            animation: fadeIn 2.5s ease-out forwards;
        }

        /* 5. Universal Text Styling (12px, Bold, Italic) */
        .site-title,
        .keyword,
        a.contact-link,
        .projects-title,
        .projects-list span {
            font-size: 12px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: -0.01em;
            text-transform: lowercase;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        /* ONLY subtext.works is draggable */
        .site-title {
            margin-bottom: 4px;
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
            touch-action: none;
            position: relative;
            z-index: 5;
            display: inline-block;
        }

        .site-title:active {
            cursor: grabbing;
        }

        .keyword {
            opacity: 0.6;
        }

        a.contact-link {
            margin-top: 8px;
            opacity: 0.8;
            cursor: pointer;
        }

        /* Hover interactions */
        .logo-unit:hover .site-title,
        .logo-unit:hover .keyword,
        .logo-unit:hover a.contact-link,
        .projects-section:hover .projects-title,
        .projects-section:hover .projects-list span {
            opacity: 1;
        }

        a.contact-link:hover {
            opacity: 0.5 !important;
        }

        /* Projects Section Specifics */
        .projects-section {
            text-align: center;
        }

        .projects-title {
            margin-bottom: 8px;
            opacity: 0.6;
        }

        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .projects-list span {
            opacity: 0.8;
        }

        /* 6. Minimalist Scroll Indicator Arrow */
        .scroll-indicator {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-color);
            font-size: 12px;
            font-style: italic;
            opacity: 0.5;
            cursor: pointer;
            transition: opacity 0.2s ease;
            animation: bounce 2s infinite;
            user-select: none;
            z-index: 10;
        }

        .scroll-indicator:hover {
            opacity: 1;
        }

        /* 7. Bottom Left Copyright Notice (Second Scroll) */
        .copyright {
            position: absolute;
            bottom: 20px;
            left: 20px;                /* Positioned on the bottom left */
            z-index: 10;
            font-size: 8px;            /* Very small font size */
            font-weight: bold;
            font-style: italic;
            letter-spacing: -0.01em;
            text-transform: lowercase;
            color: var(--text-color);
            opacity: 0.4;
            user-select: none;
            transition: opacity 0.2s ease;
        }

        .copyright:hover {
            opacity: 1;
        }

        /* 8. Bottom Right Color Slider Styling */
        .color-slider-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            display: flex;
            align-items: center;
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }

        .color-slider-container:hover {
            opacity: 1;
        }

        input[type=range].color-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 80px;
            height: 2px;
            background: var(--text-color);
            outline: none;
            cursor: pointer;
        }

        input[type=range].color-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-color);
            cursor: pointer;
        }

        input[type=range].color-slider::-moz-range-thumb {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-color);
            border: none;
            cursor: pointer;
        }

        @keyframes fadeIn {
            from { opacity: 0; filter: blur(5px); }
            to { opacity: 1; filter: blur(0px); }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateX(-50%) translateY(0);
            }
            40% {
                transform: translateX(-50%) translateY(4px);
            }
            60% {
                transform: translateX(-50%) translateY(2px);
            }
        }
    </style>
</head>
<body>

    <!-- First Fold -->
    <div class="first-fold" id="top">
        <div class="logo-unit">
            <!-- Only subtext.works is draggable -->
            <span class="site-title" id="draggable-title">subtext.works</span>
            
            <span class="keyword">fractional ceo</span>
            <span class="keyword">strategic advisory</span>
            <span class="keyword">growth & investment</span>

            <a href="mailto:contact@subtext.works" class="contact-link">contact</a>
        </div>

        <!-- Minimalist Scroll Down Indicator -->
        <div class="scroll-indicator" id="scrollArrow">↓</div>
    </div>

    <!-- Second Fold (Below First Scroll) -->
    <div class="second-fold" id="projects">
        <div class="projects-section">
            <p class="projects-title">projects & partners include:</p>
            <div class="projects-list">
                <span>ark journal</span>
                <span>bd barcelona</span>
                <span>erria</span>
                <span>evan kinori</span>
                <span>everyday^</span>
                <span>frama</span>
                <span>frontrose</span>
                <span>hosta family office</span>
                <span>jb blunk estate</span>
            </div>
        </div>

        <!-- Copyright Notice on Second Scroll (Bottom Left) -->
        <div class="copyright">&copy; 2026, all rights reserved</div>
    </div>

    <!-- Fixed Bottom Right Background Color Slider -->
    <div class="color-slider-container">
        <input type="range" id="bgSlider" class="color-slider" min="0" max="100" value="0">
    </div>

    <script>
        // ------------------------------------
        // Smooth Scroll Arrow Action
        // ------------------------------------
        document.getElementById('scrollArrow').addEventListener('click', () => {
            window.scrollTo({
                top: window.innerHeight,
                behavior: 'smooth'
            });
        });

        // ------------------------------------
        // Background Color Gradient Interpolation
        // ------------------------------------
        const slider = document.getElementById('bgSlider');
        slider.addEventListener('input', (e) => {
            const val = e.target.value / 100;
            
            // From #181a18 (RGB 24, 26, 24) to Cobalt Blue #0047ab (RGB 0, 71, 171)
            const r = Math.round(24 + (0 - 24) * val);
            const g = Math.round(26 + (71 - 26) * val);
            const b = Math.round(24 + (171 - 24) * val);

            document.body.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
        });

        // ------------------------------------
        // Drag Logic ONLY for subtext.works
        // ------------------------------------
        const titleElem = document.getElementById('draggable-title');
        let isDragging = false;
        let startX, startY;
        let currentX = 0, currentY = 0;

        function startDrag(e) {
            isDragging = true;

            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

            startX = clientX - currentX;
            startY = clientY - currentY;

            document.addEventListener('mousemove', drag);
            document.addEventListener('touchmove', drag, { passive: false });
            document.addEventListener('mouseup', stopDrag);
            document.addEventListener('touchend', stopDrag);
        }

        function drag(e) {
            if (!isDragging) return;

            const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

            if (e.cancelable) e.preventDefault();

            currentX = clientX - startX;
            currentY = clientY - startY;

            titleElem.style.transform = `translate(${currentX}px, ${currentY}px)`;
        }

        function stopDrag() {
            isDragging = false;
            document.removeEventListener('mousemove', drag);
            document.removeEventListener('touchmove', drag);
            document.removeEventListener('mouseup', stopDrag);
            document.removeEventListener('touchend', stopDrag);
        }

        titleElem.addEventListener('mousedown', startDrag);
        titleElem.addEventListener('touchstart', startDrag, { passive: false });
    </script>

</body>
</html>
