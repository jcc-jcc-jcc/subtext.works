<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subtext.works</title>
    <style>
        /* Color Palette (Dark Grey/Green & Yellow) */
        :root {
            --bg-color: #181a18;       /* Dark grey-green background */
            --text-color: #ebd15b;     /* Classic yellow text */
        }

        /* 1. Registering the .woff file */
        @font-face {
            font-family: 'RadioGrotesk';
            src: url('PPRadioGrotesk-BoldItalic.woff') format('woff');
            font-weight: bold;
            font-style: italic;
            font-display: swap;
        }

        /* 2. Page Layout & Smooth Scrolling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-color);
            width: 100vw;
            overflow-x: hidden;
            overflow-y: auto;          /* Enables vertical scrolling */
            font-family: 'RadioGrotesk', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 3. Section Containers */
        .first-fold,
        .second-fold {
            height: 100vh;
            width: 100%;
            position: relative;
        }

        /* 4. Draggable Containers */
        .draggable {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            
            cursor: grab;
            user-select: none;
            -webkit-user-drag: none;
            touch-action: none;
            
            /* Fade-in Animation */
            opacity: 0;
            animation: fadeIn 2.5s ease-out forwards;
        }

        .draggable:active {
            cursor: grabbing;
        }

        /* 5. Universal Text Styling (12px, Bold, Italic) */
        .site-title,
        .keyword,
        a.contact-link,
        .projects-title,
        .projects-list span {
            font-size: 12px;
            font-weight: bold;
            font-style: italic;
            letter-spacing: -0.01em;
            text-transform: lowercase;
            color: var(--text-color);
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .site-title {
            margin-bottom: 4px;
        }

        .keyword {
            opacity: 0.6;
        }

        a.contact-link {
            margin-top: 8px;
            opacity: 0.8;
            cursor: pointer;
        }

        /* Hover interactions for draggable units */
        .draggable:hover .site-title,
        .draggable:hover .keyword,
        .draggable:hover a.contact-link,
        .draggable:hover .projects-title,
        .draggable:hover .projects-list span {
            opacity: 1;
        }

        a.contact-link:hover {
            opacity: 0.5 !important;
        }

        /* Projects Section Specifics */
        .projects-section {
            text-align: center;
        }

        .projects-title {
            margin-bottom: 8px;
            opacity: 0.6;
        }

        .projects-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .projects-list span {
            opacity: 0.8;
        }

        @keyframes fadeIn {
            from { opacity: 0; filter: blur(5px); }
            to { opacity: 1; filter: blur(0px); }
        }
    </style>
</head>
<body>

    <!-- First Fold -->
    <div class="first-fold">
        <div class="draggable logo-unit">
            <span class="site-title">subtext.works</span>
            <span class="keyword">strategic advisory</span>
            <span class="keyword">growth mapping</span>
            <span class="keyword">fractional ceo</span>
            <a href="mailto:contact@subtext.works" class="contact-link">contact</a>
        </div>
    </div>

    <!-- Second Fold (Below First Scroll) -->
    <div class="second-fold">
        <div class="draggable projects-section">
            <p class="projects-title">projects & partners include:</p>
            <div class="projects-list">
                <span>ark journal</span>
                <span>bd barcelona</span>
                <span>erria</span>
                <span>evan kinori</span>
                <span>everyday^</span>
                <span>frama</span>
                <span>frontrose</span>
                <span>hosta family office</span>
                <span>jb blunk estate</span>
            </div>
        </div>
    </div>

    <script>
        function makeDraggable(elem) {
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;
            let hasMoved = false;

            function startDrag(e) {
                isDragging = true;
                hasMoved = false;

                const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

                startX = clientX;
                startY = clientY;

                const parent = elem.offsetParent || document.body;
                const parentRect = parent.getBoundingClientRect();
                const elemRect = elem.getBoundingClientRect();

                initialLeft = elemRect.left - parentRect.left;
                initialTop = elemRect.top - parentRect.top;

                elem.style.transform = 'none';
                elem.style.left = initialLeft + 'px';
                elem.style.top = initialTop + 'px';

                document.addEventListener('mousemove', drag);
                document.addEventListener('touchmove', drag, { passive: false });
                document.addEventListener('mouseup', stopDrag);
                document.addEventListener('touchend', stopDrag);
            }

            function drag(e) {
                if (!isDragging) return;

                const clientX = e.type.startsWith('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.startsWith('touch') ? e.touches[0].clientY : e.clientY;

                const deltaX = clientX - startX;
                const deltaY = clientY - startY;

                if (Math.abs(deltaX) > 3 || Math.abs(deltaY) > 3) {
                    hasMoved = true;
                }

                if (e.cancelable) e.preventDefault();

                elem.style.left = (initialLeft + deltaX) + 'px';
                elem.style.top = (initialTop + deltaY) + 'px';
            }

            function stopDrag() {
                isDragging = false;
                document.removeEventListener('mousemove', drag);
                document.removeEventListener('touchmove', drag);
                document.removeEventListener('mouseup', stopDrag);
                document.removeEventListener('touchend', stopDrag);
            }

            elem.addEventListener('click', (e) => {
                if (hasMoved) {
                    e.preventDefault();
                }
            });

            elem.addEventListener('mousedown', startDrag);
            elem.addEventListener('touchstart', startDrag, { passive: false });
        }

        // Apply drag functionality to all elements with class 'draggable'
        document.querySelectorAll('.draggable').forEach(makeDraggable);
    </script>

</body>
</html>
