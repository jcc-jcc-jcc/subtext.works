<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>subtext.works</title>
    <style>
        /* 1. Registering the .woff file */
        @font-face {
            font-family: 'RadioGrotesk';
            /* Matches your file extension exactly */
            src: url('PPRadioGrotesk-BoldItalic.woff') format('woff');
            font-weight: bold;
            font-style: italic;
            font-display: swap;
        }

        /* 2. Page Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            /* Using your custom font with a clean backup */
            font-family: 'RadioGrotesk', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased; /* Makes the font look smoother on Macs */
        }

        /* 3. Text Styling */
        h1 {
            font-size: 3rem;           /* Impactful size */
            font-weight: bold;
            font-style: italic;
            letter-spacing: -0.03em;    /* Tight spacing for Radio Grotesk */
            text-transform: lowercase; 
            
            /* Subtle "Quiet" Animation */
            opacity: 0;
            animation: fadeIn 2.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; filter: blur(5px); } /* Starts slightly blurry and fades in */
            to { opacity: 1; filter: blur(0px); }
        }
    </style>
</head>
<body>

    <h1>subtext.works</h1>

</body>
</html>
